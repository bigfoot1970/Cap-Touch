esphome:
  name: esphome-web-daf084
  friendly_name: Touchpad
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

# Enable logging
logger:
  level: NONE

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

#wifi:
#  ssid: Storms Cellar
#  password: Stalkercat
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


# --- TOUCH SENSOR CONFIGURATION ---
esp32_touch:
  setup_mode: True

binary_sensor:
  - platform: esp32_touch
    name: "Desk Fan"
    pin: GPIO4
    threshold: 950
    id: pad_1
    filters:
      - delayed_on: 100ms 
      - delayed_off: 50ms
    

  - platform: esp32_touch
    name: "Air Cleaner"
    pin: GPIO13
    threshold: 1000
    id: pad_2
    filters:
      - delayed_on: 100ms 
      - delayed_off: 50ms

  - platform: esp32_touch
    name: "Kitchen Sink"
    pin: GPIO12
    threshold: 1000
    id: pad_3
    filters:
      - delayed_on: 100ms 
      - delayed_off: 50ms

  - platform: esp32_touch
    name: "Grow Cabinet"
    pin: GPIO14
    threshold: 1100
    id: pad_4
    filters:
      - delayed_on: 100ms 
      - delayed_off: 50ms

 

  - platform: esp32_touch
    name: "Printer Cam"
    pin: GPIO33
    threshold: 1150
    id: pad_6
    filters:
      - delayed_on: 100ms 
      - delayed_off: 50ms

  - platform: esp32_touch
    name: "Plant Cam"
    pin: GPIO32
    threshold: 1100
    id: pad_7
    filters:
      - delayed_on: 100ms 
      - delayed_off: 50ms



  - platform: esp32_touch
    name: "Bedroom Touch Raw"
    pin: GPIO27
    threshold: 800
    internal: true
    filters:
      - delayed_on: 100ms 
      - delayed_off: 50ms 
    on_multi_click:
      - timing:
          - ON for at most 0.4s
          - OFF for at least 0.2s
        then:
          - homeassistant.event:
              event: esphome.roberts_bedroom_touch
              data:
                action: short_touch

      - timing:
          - ON for at least 0.5s
        then:
          - homeassistant.event:
              event: esphome.roberts_bedroom_touch
              data:
                action: long_touch